// Ashol Dam Android app: the website inside a WebView (see MainActivity.java).
plugins {
    id 'com.android.application'
}

android {
    namespace 'bd.asholdam'
    compileSdk 36

    defaultConfig {
        applicationId 'app.vercel.ashol_daam.twa'  // kept from the first version, so this installs as an update
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
