# Checks every tracked product twice a day, even when your laptop is off.
# Needs repository secrets DATABASE_URL (and TELEGRAM_BOT_TOKEN for alerts). See DEPLOY.md.
name: Check prices

on:
  schedule:
    # GitHub cron uses UTC: 04:00 and 16:00 UTC = 10:00 and 22:00 in Dhaka.
    # GitHub can start scheduled runs a few minutes late; that's fine here.
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for testing

concurrency:
  group: check-prices
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-local.txtt
      - name: Check prices
        run: python -m app.collector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_MODE: webhook     # the hosted site receives Telegram messages
          SEED_DEMO_DATA: "0"
          BROWSER_PRICES: "1"
          BROWSER_CHANNEL: chrome
