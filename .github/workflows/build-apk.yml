# Builds the Ashol Dam Android app (APK) on GitHub's computers.
# Run it from the Actions tab: "Build Android app" → "Run workflow". The APK appears under "Artifacts".
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    the signing key, as text (android-signing/keystore-base64.txt on your PC)
#   ANDROID_KEYSTORE_PASSWORD  its password (android-signing/password.txt)
name: Build Android app

on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the app
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign it with the Ashol Dam key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets first (see the top of this file)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > signing.keystore
          TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$TOOLS/apksigner" sign --ks signing.keystore --ks-key-alias asholdam \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out AsholDam.apk aligned.apk
          "$TOOLS/apksigner" verify --print-certs AsholDam.apk
          rm signing.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: AsholDam-apk
          path: android/AsholDam.apk
          if-no-files-found: error
